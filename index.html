<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold DZhaaa - 3 Min Sniper</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
            background: #0a0a0a; 
            color: #e0e0e0; 
            padding: 10px; 
            min-height: 100vh; 
        }
        .container { max-width: 100%; margin: 0 auto; }
        
        h1 { 
            text-align: center; 
            color: #ffd700; 
            margin-bottom: 10px; 
            font-size: 22px; 
            font-weight: bold; 
            text-shadow: 0 0 10px rgba(255,215,0,0.3); 
        }
        
        .card { 
            background: #1a1a1a; 
            border-radius: 8px; 
            padding: 12px; 
            margin-bottom: 12px; 
            border: 1px solid #333; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
        }
        
        /* Chart */
        .chart-wrapper { 
            width: 100%; 
            height: 350px; 
            border-radius: 8px; 
            overflow: hidden; 
            background: #000; 
            border: 1px solid #333; 
        }
        
        /* Prediction Card */
        .prediction-card { 
            border-radius: 8px; 
            padding: 20px; 
            text-align: center; 
            border: 3px solid; 
            background: #1a1a1a; 
        }
        .prediction-card.bullish { border-color: #00ff88; background: rgba(0,255,136,0.08); }
        .prediction-card.bearish { border-color: #ff4444; background: rgba(255,68,68,0.08); }
        .prediction-card.waiting { border-color: #ffd700; background: rgba(255,215,0,0.05); }
        
        .prediction-arrow { font-size: 70px; margin: 10px 0; }
        .prediction-text { font-size: 28px; font-weight: bold; margin: 10px 0; }
        .bullish .prediction-text { color: #00ff88; }
        .bearish .prediction-text { color: #ff4444; }
        .waiting .prediction-text { color: #ffd700; }

        /* Multi-TF Status */
        .mtf-status { 
            display: flex; 
            justify-content: space-around; 
            margin: 15px 0; 
            padding: 10px; 
            background: rgba(0,0,0,0.3); 
            border-radius: 8px; 
            border: 1px solid #333; 
        }
        .tf-item { text-align: center; }
        .tf-label { font-size: 11px; color: #888; margin-bottom: 4px; }
        .tf-val { font-size: 16px; font-weight: bold; }
        .tf-up { color: #00ff88; }
        .tf-down { color: #ff4444; }
        .tf-neutral { color: #ffd700; }

        /* Confidence & Timer */
        .confidence-meter { 
            margin: 15px 0; 
            padding: 10px; 
            background: rgba(0,0,0,0.3); 
            border-radius: 8px; 
            border: 1px solid #333; 
        }
        .confidence-label { font-size: 12px; color: #888; margin-bottom: 8px; }
        .confidence-bar { 
            height: 30px; 
            background: #0a0a0a; 
            border-radius: 15px; 
            overflow: hidden; 
            border: 1px solid #333; 
        }
        .confidence-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #00ff88, #00c853); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #000; 
            font-weight: bold; 
            font-size: 14px; 
            transition: width 0.8s ease; 
        }
        
        .timer-box { 
            background: rgba(0,0,0,0.4); 
            border-radius: 8px; 
            padding: 15px; 
            margin: 15px 0; 
            border: 1px solid #444; 
        }
        .timer-label { font-size: 12px; color: #888; }
        .timer-value { 
            font-size: 50px; 
            font-weight: bold; 
            font-family: monospace; 
            color: #ffd700; 
        }
        
        /* Buttons & Badges */
        .prediction-btn { 
            width: 100%; 
            padding: 18px; 
            border: none; 
            border-radius: 8px; 
            font-size: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            background: linear-gradient(135deg, #ffd700, #ffaa00); 
            color: #000; 
            margin-top: 10px; 
        }
        .prediction-btn:disabled { opacity: 0.5; background: #444; color: #888; }
        
        .accuracy-badge { 
            display: inline-block; 
            background: rgba(0,255,136,0.15); 
            border: 1px solid #00ff88; 
            padding: 6px 18px; 
            border-radius: 20px; 
            font-size: 14px; 
            margin-top: 15px; 
            color: #00ff88; 
            font-weight: bold; 
        }
        
        .source-badge { 
            text-align: center; 
            background: rgba(0,123,255,0.1); 
            border: 1px solid #007bff; 
            color: #007bff; 
            padding: 8px; 
            border-radius: 6px; 
            font-size: 13px; 
            margin-bottom: 15px; 
            font-weight: bold; 
        }
        
        .analysis-reason { 
            background: rgba(0,0,0,0.4); 
            padding: 10px; 
            border-radius: 6px; 
            font-size: 13px; 
            color: #ccc; 
            margin: 10px 0; 
            border-right: 3px solid #ffd700; 
            text-align: right; 
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 Gold DZhaaa - 3 Min</h1>
    <div class="source-badge">📡 OANDA XAUUSD | M1 + M3 + M5 (تایبەت بە ٣ خولەک)</div>

    <!-- Chart -->
    <div class="card">
        <div class="chart-wrapper">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div id="tradingview_chart" style="height:100%;width:100%"></div>
            </div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
            new TradingView.widget({ 
                "autosize": true, 
                "symbol": "OANDA:XAUUSD", 
                "interval": "1", 
                "timezone": "Etc/UTC", 
                "theme": "dark", 
                "style": "1", 
                "locale": "ar", 
                "toolbar_bg": "#1a1a1a", 
                "enable_publishing": false, 
                "hide_top_toolbar": false, 
                "hide_legend": false, 
                "save_image": false, 
                "container_id": "tradingview_chart", 
                "studies": ["RSI@tv-basicstudies", "MAExp@tv-basicstudies"] 
            });
            </script>
        </div>
    </div>

    <!-- Prediction Section -->
    <div class="card">
        <div id="predictionCard" class="prediction-card waiting">
            <div style="font-size:14px; color:#888; margin-bottom:10px;">شیکاری تایبەت بە ٣ خولەک</div>
            
            <div class="mtf-status">
                <div class="tf-item"><div class="tf-label">M1 (١ خولەک)</div><div id="tf1" class="tf-val tf-neutral">⏳</div></div>
                <div class="tf-item"><div class="tf-label">M3 (٣ خولەک)</div><div id="tf3" class="tf-val tf-neutral">⏳</div></div>
                <div class="tf-item"><div class="tf-label">M5 (٥ خولەک)</div><div id="tf5" class="tf-val tf-neutral">⏳</div></div>
            </div>

            <div id="predictionArrow" class="prediction-arrow">⏳</div>
            <div id="predictionText" class="prediction-text">چاوەڕێبە...</div>
            <div id="analysisReason" class="analysis-reason" style="display:none;"></div>

            <div class="confidence-meter">
                <div class="confidence-label">هێزی پێشبینی (Confidence Score)</div>
                <div class="confidence-bar"><div id="confidenceFill" class="confidence-fill" style="width: 0%">0%</div></div>
            </div>
            
            <div class="timer-box">
                <div class="timer-label">کاتی بەسەرچوونی پێشبینی</div>
                <div id="timerValue" class="timer-value">03:00</div>
            </div>
            
            <button id="predictionBtn" class="prediction-btn" onclick="generatePrediction()">🚀 دەستپێکردنی شیکاری ٣ خولەک</button>
            <div class="accuracy-badge">مۆتۆری Sniper 3-Min</div>
        </div>
    </div>
</div>

<script>
    let priceHistory = [];
    let predictionActive = false;
    let countdownInterval = null;

    async function fetchGoldPrice() {
        try {
            const response = await fetch('https://api.metalpriceapi.com/v1/latest?api_key=55da3a9ecdb23ffd4370123283fdb61b&base=USD&currencies=XAU');
            const data = await response.json();
            if (data.success && data.rates && data.rates.XAU) {
                updatePriceData(1 / data.rates.XAU);
            } else { throw new Error('API Error'); }
        } catch (error) {
            const last = priceHistory.length > 0 ? priceHistory[priceHistory.length-1] : 2350;
            updatePriceData(last + (Math.random() - 0.5) * 2);
        }
    }

    function updatePriceData(price) {
        priceHistory.push(price);
        if (priceHistory.length > 150) priceHistory.shift();
    }

    function calcSMA(prices, period) {
        if (prices.length < period) return null;
        return prices.slice(-period).reduce((a,b) => a+b, 0) / period;
    }
    
    function calcEMA(prices, period) {
        if (prices.length < period) return null;
        const k = 2 / (period + 1);
        let ema = prices.slice(0, period).reduce((a,b) => a+b, 0) / period;
        for (let i = period; i < prices.length; i++) ema = prices[i] * k + ema * (1 - k);
        return ema;
    }
    
    function calcRSI(prices, period = 14) {
        if (prices.length < period + 1) return 50;
        let gains = 0, losses = 0;
        for (let i = prices.length - period; i < prices.length; i++) {
            const change = prices[i] - prices[i - 1];
            if (change > 0) gains += change; else losses += Math.abs(change);
        }
        const avgGain = gains / period, avgLoss = losses / period;
        if (avgLoss === 0) return 100;
        return 100 - (100 / (1 + avgGain / avgLoss));
    }

    function analyzeTF(prices) {
        if (prices.length < 10) return { score: 0, signal: 'neutral' };
        const current = prices[prices.length - 1];
        const rsi = calcRSI(prices);
        const sma20 = calcSMA(prices, Math.min(20, prices.length));
        const ema9 = calcEMA(prices, Math.min(9, prices.length));
        
        let score = 0;
        // RSI Logic
        if (rsi < 30) score += 2; else if (rsi > 70) score -= 2;
        else if (rsi > 50) score += 1; else score -= 1;
        
        // Trend Logic
        if (current > sma20 && current > ema9) score += 3;
        else if (current < sma20 && current < ema9) score -= 3;
        else if (current > sma20) score += 1; else score -= 1;

        let signal = 'neutral';
        if (score >= 3) signal = 'up';
        else if (score <= -3) signal = 'down';
        
        return { score, signal };
    }

    function generatePrediction() {
        if (predictionActive || priceHistory.length < 60) {
            if (priceHistory.length < 60) alert('تکایە چاوەڕێ بکە تا داتا کۆبکرێتەوە (حداقل ٥ خولەک)');
            return;
        }
        
        predictionActive = true;
        
        // دابەشکردنی داتا بۆ M1, M3, M5
        // هەر ١٢ خاڵێک = ١ خولەک (چونکە هەر ٥ چرکە جارێک داتا وەردەگرین)
        const m1Data = priceHistory.slice(-12);   
        const m3Data = priceHistory.slice(-36);   
        const m5Data = priceHistory.slice(-60);   

        const tf1Res = analyzeTF(m1Data);
        const tf3Res = analyzeTF(m3Data); // ئەمە گرنگترینە بۆ ٣ خولەک
        const tf5Res = analyzeTF(m5Data);

        const updateTFUI = (id, res) => {
            const el = document.getElementById(id);
            el.textContent = res.signal === 'up' ? '⬆️ UP' : res.signal === 'down' ? '⬇️ DOWN' : ' FLAT';
            el.className = `tf-val ${res.signal === 'up' ? 'tf-up' : res.signal === 'down' ? 'tf-down' : 'tf-neutral'}`;
        };
        updateTFUI('tf1', tf1Res);
        updateTFUI('tf3', tf3Res);
        updateTFUI('tf5', tf5Res);

        // کێشەکان: M3 گرنگترینە (٥٠٪)، M1 بۆ چوونەژوورەوە (٣٠٪)، M5 بۆ مەیل (٢٠٪)
        const totalScore = (tf1Res.score * 0.3) + (tf3Res.score * 0.5) + (tf5Res.score * 0.2);
        
        let alignment = 0;
        if (tf1Res.signal !== 'neutral') alignment++;
        if (tf3Res.signal !== 'neutral') alignment++;
        if (tf5Res.signal !== 'neutral') alignment++;
        
        let baseConfidence = 60 + (Math.abs(totalScore) * 5);
        if (alignment === 3) baseConfidence += 20; 
        else if (alignment === 2) baseConfidence += 10;
        const finalConfidence = Math.min(98, Math.max(50, baseConfidence));

        const direction = totalScore > 0 ? 'bullish' : 'bearish';
        
        const reasons = [];
        if (tf3Res.signal === 'up') reasons.push("M3 مەیلی سەرەوە (گرنگترین)");
        if (tf3Res.signal === 'down') reasons.push("M3 مەیلی خوارەوە (گرنگترین)");
        if (tf1Res.signal === 'up') reasons.push("M1 کاتی چوونەژوورەوەی BUY");
        if (tf1Res.signal === 'down') reasons.push("M1 کاتی چوونەژوورەوەی SELL");
        if (tf5Res.signal === 'up') reasons.push("M5 پشتگیری کورتخایەن");
        if (tf5Res.signal === 'down') reasons.push("M5 بەربەستی کورتخایەن");
        
        const reasonText = " هۆکارەکان: " + (reasons.length > 0 ? reasons.join(" | ") : "بازاڕ نائارامە");

        const card = document.getElementById('predictionCard');
        const arrow = document.getElementById('predictionArrow');
        const text = document.getElementById('predictionText');
        const btn = document.getElementById('predictionBtn');
        const confFill = document.getElementById('confidenceFill');
        const reasonBox = document.getElementById('analysisReason');

        if (direction === 'bullish') {
            card.className = 'prediction-card bullish';
            arrow.textContent = '️';
            text.textContent = 'بارز دەبێتەوە (BUY)';
            confFill.style.background = 'linear-gradient(90deg, #00ff88, #00c853)';
        } else {
            card.className = 'prediction-card bearish';
            arrow.textContent = '⬇️';
            text.textContent = 'نزم دەبێتەوە (SELL)';
            confFill.style.background = 'linear-gradient(90deg, #ff4444, #c50000)';
        }
        
        confFill.style.width = finalConfidence.toFixed(0) + '%';
        confFill.textContent = finalConfidence.toFixed(0) + '%';
        reasonBox.style.display = 'block';
        reasonBox.textContent = reasonText;
        
        btn.disabled = true;
        btn.textContent = '⏳ شیکاری چالاکە...';
        
        startCountdown(180); // ٣ خولەک
        setTimeout(() => resetPredictionButton(), 180000);
    }

    function startCountdown(seconds) {
        if (countdownInterval) clearInterval(countdownInterval);
        let remaining = seconds;
        const timerEl = document.getElementById('timerValue');
        countdownInterval = setInterval(() => {
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (remaining <= 0) clearInterval(countdownInterval);
            remaining--;
        }, 1000);
    }

    function resetPredictionButton() {
        predictionActive = false;
        const card = document.getElementById('predictionCard');
        const arrow = document.getElementById('predictionArrow');
        const text = document.getElementById('predictionText');
        const btn = document.getElementById('predictionBtn');
        const confFill = document.getElementById('confidenceFill');
        const reasonBox = document.getElementById('analysisReason');
        
        card.className = 'prediction-card waiting';
        arrow.textContent = '⏳';
        text.textContent = 'چاوەڕێبە...';
        btn.disabled = false;
        btn.textContent = '🚀 دەستپێکردنی شیکاری ٣ خولەک';
        document.getElementById('timerValue').textContent = '03:00';
        confFill.style.width = '0%';
        confFill.textContent = '0%';
        reasonBox.style.display = 'none';
        
        ['tf1', 'tf3', 'tf5'].forEach(id => {
            const el = document.getElementById(id);
            el.textContent = '⏳'; el.className = 'tf-val tf-neutral';
        });

        if (countdownInterval) clearInterval(countdownInterval);
    }

    window.onload = function() {
        fetchGoldPrice();
        setInterval(fetchGoldPrice, 5000);
    };
</script>
</body>
</html>
