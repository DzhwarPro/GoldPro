<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gold Sniper Pro - Fixed Button</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        
        body.dark { background: #000000; color: #e0e0e0; }
        body.dark .card { background: #050505; border: 1px solid #1a1a1a; }
        body.dark .mtf-status, body.dark .confidence-meter, body.dark .timer-box, body.dark .status-box, body.dark .analysis-reason { background: #0a0a0a; border: 1px solid #1a1a1a; }
        body.dark .source-badge { background: #0a0a0a; border: 1px solid #007bff; color: #007bff; }
        
        body.light { background: #ffffff; color: #1a1a1a; }
        body.light .card { background: #ffffff; border: 1px solid #e0e0e0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        body.light .mtf-status, body.light .confidence-meter, body.light .timer-box { background: #f5f5f5; border: 1px solid #e0e0e0; }
        body.light .status-box { background: #f0f7ff; border: 1px solid #007bff; color: #007bff; }
        body.light .analysis-reason { background: #f9f9f9; border: 1px solid #e0e0e0; color: #333; }
        body.light .source-badge { background: #f0f7ff; border: 1px solid #007bff; color: #007bff; }

        .container { max-width: 100%; margin: 0 auto; padding: 10px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { text-align: center; color: #d4a017; font-size: 22px; font-weight: bold; }
        
        .theme-toggle {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none; border-radius: 50%; width: 50px; height: 50px;
            cursor: pointer; font-size: 24px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
            transition: transform 0.3s;
        }
        .theme-toggle:hover { transform: rotate(180deg); }
        
        .card { border-radius: 10px; padding: 12px; margin-bottom: 12px; }
        .chart-wrapper { width: 100%; height: 380px; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        
        .prediction-card { border-radius: 10px; padding: 20px; text-align: center; border: 2px solid; }
        .prediction-card.bullish { border-color: #00c853; background: rgba(0,200,83,0.08); }
        .prediction-card.bearish { border-color: #d50000; background: rgba(213,0,0,0.08); }
        .prediction-card.waiting { border-color: #d4a017; background: rgba(212,160,23,0.05); }
        .prediction-card.collecting { border-color: #007bff; background: rgba(0,123,255,0.08); }
        
        .prediction-arrow { font-size: 70px; margin: 10px 0; }
        .prediction-text { font-size: 28px; font-weight: bold; margin: 10px 0; }
        .bullish .prediction-text { color: #00c853; }
        .bearish .prediction-text { color: #d50000; }
        .waiting .prediction-text { color: #d4a017; }
        .collecting .prediction-text { color: #007bff; }

        .mtf-status { display: flex; justify-content: space-around; margin: 15px 0; padding: 12px; border-radius: 10px; }
        .tf-item { text-align: center; }
        .tf-label { font-size: 11px; margin-bottom: 4px; opacity: 0.7; }
        .tf-val { font-size: 16px; font-weight: bold; }
        .tf-up { color: #00c853; }
        .tf-down { color: #d50000; }
        .tf-neutral { opacity: 0.5; }

        .confidence-meter { margin: 15px 0; padding: 12px; border-radius: 10px; }
        .confidence-label { font-size: 12px; margin-bottom: 8px; opacity: 0.7; }
        .confidence-bar { height: 32px; background: rgba(0,0,0,0.1); border-radius: 16px; overflow: hidden; }
        .confidence-fill { 
            height: 100%; background: linear-gradient(90deg, #00c853, #00e676); 
            display: flex; align-items: center; justify-content: center; 
            color: #fff; font-weight: bold; font-size: 14px; transition: width 0.8s ease; 
        }
        
        .timer-box { border-radius: 10px; padding: 15px; margin: 15px 0; text-align: center; }
        .timer-label { font-size: 12px; opacity: 0.7; }
        .timer-value { font-size: 50px; font-weight: bold; font-family: monospace; color: #d4a017; }
        
        .status-box { border-radius: 10px; padding: 12px; margin: 10px 0; font-size: 13px; text-align: center; }
        
        /* دوگمەکە لە شوێنی خۆی دەمێنێتەوە */
        .prediction-btn { 
            width: 100%; padding: 18px; border: none; border-radius: 10px; 
            font-size: 20px; font-weight: bold; cursor: pointer; 
            background: linear-gradient(135deg, #d4a017, #f0c040); color: #fff; margin-top: 10px;
            position: relative;
        }
        .prediction-btn:disabled { opacity: 0.4; background: #666; cursor: not-allowed; }
        .prediction-btn.ready { 
            background: linear-gradient(135deg, #00c853, #00e676); 
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        
        .accuracy-badge { 
            display: inline-block; background: rgba(0,200,83,0.15); border: 1px solid #00c853; 
            padding: 6px 18px; border-radius: 20px; font-size: 14px; margin-top: 15px; 
            color: #00c853; font-weight: bold; 
        }
        
        .source-badge { text-align: center; padding: 8px; border-radius: 8px; font-size: 13px; margin-bottom: 15px; font-weight: bold; }
        .analysis-reason { padding: 12px; border-radius: 8px; font-size: 13px; margin: 10px 0; border-right: 3px solid #d4a017; text-align: right; line-height: 1.6; }
        .cycle-info { font-size: 11px; margin-top: 10px; text-align: center; opacity: 0.6; }
        
        .sync-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 8px; padding: 4px 12px; background: rgba(0,123,255,0.1); border-radius: 12px; }
        .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #007bff; animation: blink 1.5s infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .phase-badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-top: 10px; }
        .phase-prediction { background: rgba(212,160,23,0.2); color: #d4a017; border: 1px solid #d4a017; }
        .phase-collecting { background: rgba(0,123,255,0.2); color: #007bff; border: 1px solid #007bff; }
        .phase-ready { background: rgba(0,200,83,0.2); color: #00c853; border: 1px solid #00c853; }
        .phase-volatile { background: rgba(255,152,0,0.2); color: #ff9800; border: 1px solid #ff9800; }
        
        .volatility-indicator { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 8px; padding: 4px 12px; border-radius: 12px; }
        .vol-low { background: rgba(0,200,83,0.15); color: #00c853; }
        .vol-medium { background: rgba(255,152,0,0.15); color: #ff9800; }
        .vol-high { background: rgba(213,0,0,0.15); color: #d50000; }
    </style>
</head>
<body class="dark">

<div class="container">
    <div class="header">
        <h1>🎯 Gold Sniper Pro</h1>
        <button class="theme-toggle" onclick="toggleTheme()" title="گۆڕینی ڕەنگ"></button>
    </div>
    
    <div class="source-badge">📡 M1 + M5 + M15 | چارتی M5 | دەستپێکردنی دەستی</div>

    <div class="card">
        <div class="chart-wrapper">
            <div id="tradingview_chart" style="height:100%;width:100%"></div>
        </div>
    </div>

    <div class="card">
        <div id="predictionCard" class="prediction-card waiting">
            <div style="font-size:14px; margin-bottom:10px; opacity:0.7;">شیکاری M1 + M5 + M15 بۆ ٥ خولەک</div>
            
            <div class="mtf-status">
                <div class="tf-item"><div class="tf-label">M1</div><div id="tf1" class="tf-val tf-neutral">⏳</div></div>
                <div class="tf-item"><div class="tf-label">M5</div><div id="tf5" class="tf-val tf-neutral">⏳</div></div>
                <div class="tf-item"><div class="tf-label">M15</div><div id="tf15" class="tf-val tf-neutral">⏳</div></div>
            </div>

            <div id="predictionArrow" class="prediction-arrow">⏳</div>
            <div id="predictionText" class="prediction-text">چاوەڕێبە...</div>
            <div id="analysisReason" class="analysis-reason" style="display:none;"></div>

            <div class="confidence-meter">
                <div class="confidence-label">هێزی پێشبینی</div>
                <div class="confidence-bar"><div id="confidenceFill" class="confidence-fill" style="width: 0%">0%</div></div>
            </div>
            
            <div id="statusBox" class="status-box" style="display:none;"></div>
            
            <div class="timer-box">
                <div class="timer-label" id="timerLabel">کاتی ماوە</div>
                <div id="timerValue" class="timer-value">05:00</div>
                <div id="phaseBadge" class="phase-badge phase-prediction">قۆناغی پێشبینی</div>
                <div class="sync-indicator">
                    <div class="sync-dot"></div>
                    <span>هاوکاتکراو لەگەڵ چارت</span>
                </div>
                <div id="volatilityIndicator" class="volatility-indicator vol-low" style="display:none;">
                    <span id="volatilityText">بازاڕ ئارامە</span>
                </div>
            </div>
            
            <!-- دوگمەکە لەم شوێنەدا دەمێنێتەوە -->
            <button id="predictionBtn" class="prediction-btn" onclick="handleButtonClick()">🚀 دەستپێکردن</button>
            
            <div class="accuracy-badge">🎯 مۆتۆری Pro Sniper</div>
            <div class="cycle-info">🔄 ٥ خولەک پێشبینی → ٢+ خولەک کۆکردنەوەی داتا → دەستپێکردنی دەستی</div>
        </div>
    </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
    let priceHistory = [];
    let predictionActive = false;
    let collectingData = false;
    let countdownInterval = null;
    let autoRestartTimeout = null;
    let currentTheme = 'dark';
    let volatilityLevel = 'low';
    let buttonState = 'idle'; // idle, predicting, collecting, ready

    function toggleTheme() {
        const body = document.body;
        if (currentTheme === 'dark') {
            body.classList.remove('dark');
            body.classList.add('light');
            currentTheme = 'light';
            reloadChart('light');
        } else {
            body.classList.remove('light');
            body.classList.add('dark');
            currentTheme = 'dark';
            reloadChart('dark');
        }
    }

    function reloadChart(theme) {
        const container = document.getElementById('tradingview_chart');
        container.innerHTML = ''; 
        const bgColor = theme === 'dark' ? '#000000' : '#ffffff';
        new TradingView.widget({ 
            "autosize": true, "symbol": "OANDA:XAUUSD", "interval": "5", 
            "timezone": "Etc/UTC", "theme": theme, "style": "1", "locale": "ar", 
            "toolbar_bg": bgColor, "enable_publishing": false, "hide_top_toolbar": false, 
            "hide_legend": false, "save_image": false, "container_id": "tradingview_chart", 
            "studies": ["RSI@tv-basicstudies", "MAExp@tv-basicstudies", "BB@tv-basicstudies"] 
        });
    }

    // کاتی کرتەکردن لەسەر دوگمەکە
    function handleButtonClick() {
        if (buttonState === 'idle' || buttonState === 'ready') {
            startCycle();
        }
        // ئەگەر لە قۆناغی predicting یان collecting بێت، هیچ ناکات
    }

    async function fetchGoldPrice() {
        try {
            const response = await fetch('https://api.metalpriceapi.com/v1/latest?api_key=55da3a9ecdb23ffd4370123283fdb61b&base=USD&currencies=XAU');
            const data = await response.json();
            if (data.success && data.rates && data.rates.XAU) {
                updatePriceData(1 / data.rates.XAU);
            } else { throw new Error('API Error'); }
        } catch (error) {
            const last = priceHistory.length > 0 ? priceHistory[priceHistory.length-1] : 2350;
            updatePriceData(last + (Math.random() - 0.5) * 3);
        }
    }

    function updatePriceData(price) {
        priceHistory.push(price);
        if (priceHistory.length > 500) priceHistory.shift();
        checkVolatility();
    }

    function checkVolatility() {
        if (priceHistory.length < 20) return;
        const recent = priceHistory.slice(-20);
        const changes = [];
        for (let i = 1; i < recent.length; i++) {
            changes.push(Math.abs(recent[i] - recent[i-1]));
        }
        const avgChange = changes.reduce((a,b) => a+b, 0) / changes.length;
        const maxChange = Math.max(...changes);
        
        const volIndicator = document.getElementById('volatilityIndicator');
        const volText = document.getElementById('volatilityText');
        
        if (maxChange > 5 || avgChange > 2) {
            volatilityLevel = 'high';
            volIndicator.className = 'volatility-indicator vol-high';
            volText.textContent = '⚠️ بازاڕ زۆر نائارامە';
        } else if (maxChange > 2 || avgChange > 1) {
            volatilityLevel = 'medium';
            volIndicator.className = 'volatility-indicator vol-medium';
            volText.textContent = '⚡ بازاڕ نائارامە';
        } else {
            volatilityLevel = 'low';
            volIndicator.className = 'volatility-indicator vol-low';
            volText.textContent = '✅ بازاڕ ئارامە';
        }
        volIndicator.style.display = 'inline-flex';
    }

    function calcSMA(prices, period) {
        if (prices.length < period) return null;
        return prices.slice(-period).reduce((a,b) => a+b, 0) / period;
    }
    
    function calcEMA(prices, period) {
        if (prices.length < period) return null;
        const k = 2 / (period + 1);
        let ema = prices.slice(0, period).reduce((a,b) => a+b, 0) / period;
        for (let i = period; i < prices.length; i++) ema = prices[i] * k + ema * (1 - k);
        return ema;
    }
    
    function calcRSI(prices, period = 14) {
        if (prices.length < period + 1) return 50;
        let gains = 0, losses = 0;
        for (let i = prices.length - period; i < prices.length; i++) {
            const change = prices[i] - prices[i - 1];
            if (change > 0) gains += change; else losses += Math.abs(change);
        }
        const avgGain = gains / period, avgLoss = losses / period;
        if (avgLoss === 0) return 100;
        return 100 - (100 / (1 + avgGain / avgLoss));
    }

    function analyzeTF(prices, weight) {
        if (prices.length < 20) return { score: 0, signal: 'neutral', strength: 0 };
        const current = prices[prices.length - 1];
        const rsi = calcRSI(prices);
        const sma20 = calcSMA(prices, Math.min(20, prices.length));
        const ema9 = calcEMA(prices, Math.min(9, prices.length));
        let score = 0, strength = 0;
        if (rsi < 25) { score += 3; strength += 3; }
        else if (rsi > 75) { score -= 3; strength -= 3; }
        else if (rsi < 35) { score += 2; strength += 2; }
        else if (rsi > 65) { score -= 2; strength -= 2; }
        else if (rsi > 50) { score += 1; strength += 1; }
        else { score -= 1; strength -= 1; }
        if (sma20 && ema9) {
            if (current > sma20 && current > ema9) { score += 3; strength += 3; }
            else if (current < sma20 && current < ema9) { score -= 3; strength -= 3; }
            else if (current > sma20) { score += 1; strength += 1; }
            else { score -= 1; strength -= 1; }
        }
        score = score * weight;
        strength = Math.abs(strength) * weight;
        let signal = 'neutral';
        if (score >= 3) signal = 'up';
        else if (score <= -3) signal = 'down';
        return { score, signal, strength };
    }

    function startCycle() {
        if (predictionActive || collectingData) return;
        if (priceHistory.length < 60) { alert('تکایە چاوەڕێ بکە تا داتا کۆبکرێتەوە'); return; }
        if (autoRestartTimeout) { clearTimeout(autoRestartTimeout); autoRestartTimeout = null; }
        
        predictionActive = true;
        buttonState = 'predicting';
        updatePhaseBadge('prediction');
        
        const m1Data = priceHistory.slice(-12);   
        const m5Data = priceHistory.slice(-60);   
        const m15Data = priceHistory.slice(-180);   
        const tf1Res = analyzeTF(m1Data, 0.15);
        const tf5Res = analyzeTF(m5Data, 0.40);
        const tf15Res = analyzeTF(m15Data, 0.45);

        const updateTFUI = (id, res) => {
            const el = document.getElementById(id);
            el.textContent = res.signal === 'up' ? '⬆️ UP' : res.signal === 'down' ? '️ DOWN' : '➖ FLAT';
            el.className = `tf-val ${res.signal === 'up' ? 'tf-up' : res.signal === 'down' ? 'tf-down' : 'tf-neutral'}`;
        };
        updateTFUI('tf1', tf1Res);
        updateTFUI('tf5', tf5Res);
        updateTFUI('tf15', tf15Res);

        const totalScore = tf1Res.score + tf5Res.score + tf15Res.score;
        const totalStrength = tf1Res.strength + tf5Res.strength + tf15Res.strength;
        let alignment = 0;
        if (tf1Res.signal !== 'neutral') alignment++;
        if (tf5Res.signal !== 'neutral') alignment++;
        if (tf15Res.signal !== 'neutral') alignment++;
        let baseConfidence = 70 + (totalStrength * 3);
        if (alignment === 3) baseConfidence += 15; 
        else if (alignment === 2) baseConfidence += 8;
        const finalConfidence = Math.min(99, Math.max(55, baseConfidence));
        const direction = totalScore > 0 ? 'bullish' : 'bearish';
        
        const reasons = [];
        if (tf15Res.signal === 'up') reasons.push("M15: مەیلی بەهێزی سەرەوە");
        if (tf15Res.signal === 'down') reasons.push("M15: مەیلی بەهێزی خوارەوە");
        if (tf5Res.signal === 'up') reasons.push("M5: پشتگیری سەرەوە");
        if (tf5Res.signal === 'down') reasons.push("M5: بەربەستی خوارەوە");
        if (tf1Res.signal === 'up') reasons.push("M1: کاتی BUY");
        if (tf1Res.signal === 'down') reasons.push("M1: کاتی SELL");
        const reasonText = "🔍 هۆکارەکان:\n" + (reasons.length > 0 ? reasons.join("\n") : "⚠️ بازاڕ نائارامە");

        const card = document.getElementById('predictionCard');
        const arrow = document.getElementById('predictionArrow');
        const text = document.getElementById('predictionText');
        const btn = document.getElementById('predictionBtn');
        const confFill = document.getElementById('confidenceFill');
        const reasonBox = document.getElementById('analysisReason');
        const statusBox = document.getElementById('statusBox');
        const timerLabel = document.getElementById('timerLabel');

        if (direction === 'bullish') {
            card.className = 'prediction-card bullish';
            arrow.textContent = '⬆️';
            text.textContent = 'بارز دەبێتەوە (BUY)';
        } else {
            card.className = 'prediction-card bearish';
            arrow.textContent = '⬇️';
            text.textContent = 'نزم دەبێتەوە (SELL)';
        }
        confFill.style.width = finalConfidence.toFixed(0) + '%';
        confFill.textContent = finalConfidence.toFixed(0) + '%';
        reasonBox.style.display = 'block';
        reasonBox.textContent = reasonText;
        statusBox.style.display = 'block';
        statusBox.textContent = '🎯 پێشبینی چالاکە - چاوەڕوانی ئەنجام...';
        timerLabel.textContent = 'کاتی بەسەرچوونی پێشبینی';
        
        // دوگمەکە ناچالاک دەبێت بەڵام لە شوێنی خۆی دەمێنێتەوە
        btn.disabled = true;
        btn.textContent = '⏳ پێشبینی چالاکە...';
        btn.classList.remove('ready');
        
        document.getElementById('volatilityIndicator').style.display = 'none';
        
        startCountdown(300);
        autoRestartTimeout = setTimeout(() => { startDataCollection(); }, 300000);
    }

    function startDataCollection() {
        predictionActive = false;
        collectingData = true;
        buttonState = 'collecting';
        updatePhaseBadge('collecting');
        
        const card = document.getElementById('predictionCard');
        const arrow = document.getElementById('predictionArrow');
        const text = document.getElementById('predictionText');
        const statusBox = document.getElementById('statusBox');
        const timerLabel = document.getElementById('timerLabel');
        const btn = document.getElementById('predictionBtn');
        
        card.className = 'prediction-card collecting';
        arrow.textContent = '📡';
        text.textContent = 'کۆکردنەوەی داتای تازە...';
        timerLabel.textContent = 'کاتی کۆکردنەوەی داتا';
        
        // دوگمەکە هێشتا ناچالاکە
        btn.disabled = true;
        btn.classList.remove('ready');
        
        let collectionTime = 120;
        if (volatilityLevel === 'high') {
            collectionTime = 300;
            statusBox.textContent = '⚠️ بازاڕ زۆر نائارامە - کۆکردنەوەی داتا (٥ خولەک)';
            btn.textContent = '⏳ چاوەڕوانی ئارامبوونی بازاڕ...';
            updatePhaseBadge('volatile');
        } else if (volatilityLevel === 'medium') {
            collectionTime = 180;
            statusBox.textContent = '⚡ بازاڕ نائارامە - کۆکردنەوەی داتا (٣ خولەک)';
            btn.textContent = '⏳ چاوەڕوانی ئارامبوون...';
        } else {
            statusBox.textContent = '✅ بازاڕ ئارامە - کۆکردنەوەی داتا (٢ خولەک)';
            btn.textContent = '⏳ کۆکردنەوەی داتا...';
        }
        statusBox.style.display = 'block';
        
        startCountdown(collectionTime);
        
        // دوای تەواوبوونی کۆکردنەوە، دوگمەکە چالاک دەبێتەوە
        autoRestartTimeout = setTimeout(() => {
            collectingData = false;
            enableStartButton();
        }, collectionTime * 1000);
    }

    function enableStartButton() {
        const btn = document.getElementById('predictionBtn');
        const statusBox = document.getElementById('statusBox');
        const timerLabel = document.getElementById('timerLabel');
        const timerValue = document.getElementById('timerValue');
        
        buttonState = 'ready';
        
        // دوگمەکە چالاک دەبێتەوە بەڵام لە شوێنی خۆی دەمێنێتەوە
        btn.disabled = false;
        btn.textContent = '🚀 دەستپێکردن';
        btn.classList.add('ready');
        
        statusBox.style.display = 'block';
        statusBox.textContent = '✅ داتا تازە کرایەوە - ئێستا دەتوانیت دەست پێ بکەیت!';
        statusBox.style.background = currentTheme === 'dark' ? 'rgba(0,255,136,0.1)' : 'rgba(0,200,83,0.15)';
        statusBox.style.color = currentTheme === 'dark' ? '#00ff88' : '#00c853';
        statusBox.style.border = `1px solid ${currentTheme === 'dark' ? '#00ff88' : '#00c853'}`;
        
        timerLabel.textContent = 'کاتی ماوە';
        timerValue.textContent = '05:00';
        updatePhaseBadge('ready');
    }

    function updatePhaseBadge(phase) {
        const badge = document.getElementById('phaseBadge');
        if (phase === 'prediction') { badge.className = 'phase-badge phase-prediction'; badge.textContent = 'قۆناغی پێشبینی'; }
        else if (phase === 'collecting') { badge.className = 'phase-badge phase-collecting'; badge.textContent = 'کۆکردنەوەی داتا'; }
        else if (phase === 'ready') { badge.className = 'phase-badge phase-ready'; badge.textContent = 'ئامادەیە بۆ دەستپێکردن'; }
        else if (phase === 'volatile') { badge.className = 'phase-badge phase-volatile'; badge.textContent = 'بازاڕ نائارامە'; }
    }

    function startCountdown(seconds) {
        if (countdownInterval) clearInterval(countdownInterval);
        let remaining = seconds;
        const timerEl = document.getElementById('timerValue');
        countdownInterval = setInterval(() => {
            const mins = Math.floor(remaining / 60);
            const secs = remaining % 60;
            timerEl.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            if (remaining <= 0) clearInterval(countdownInterval);
            remaining--;
        }, 1000);
    }

    window.onload = function() {
        reloadChart('dark');
        fetchGoldPrice();
        setInterval(fetchGoldPrice, 5000);
    };
</script>
</body>
</html>
