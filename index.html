<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gold Sniper Pro - M5 Precision</title>
<style>
    :root {
        --bg-dark: #0a0a0f;
        --card-dark: #12121a;
        --gold: #d4af37;
        --gold-light: #f2d06b;
        --green: #00ff88;
        --red: #ff4444;
        --yellow: #ffcc00;
        --text-main: #e0e0e0;
        --text-muted: #888899;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    
    body { background: var(--bg-dark); color: var(--text-main); transition: all 0.3s; }
    body.light { background: #f4f6f8; color: #1a1a1a; --card-dark: #ffffff; }

    .container { max-width: 850px; margin: 0 auto; padding: 15px; }
    
    .header { 
        display: flex; justify-content: space-between; align-items: center; 
        margin-bottom: 20px; padding-bottom: 15px; 
        border-bottom: 2px solid var(--gold);
    }
    .header h1 { color: var(--gold); font-size: 26px; text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); }
    .theme-btn { background: none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }

    .card { 
        background: var(--card-dark); border: 1px solid #2a2a35; 
        border-radius: 16px; padding: 20px; margin-bottom: 20px; 
        box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }

    .chart-box { height: 420px; border-radius: 12px; overflow: hidden; border: 1px solid #333; }

    /* Signal Box */
    .signal-card { text-align: center; padding: 25px; position: relative; overflow: hidden; }
    .signal-card.buy { border: 2px solid var(--green); background: linear-gradient(145deg, rgba(0,255,136,0.05), transparent); }
    .signal-card.sell { border: 2px solid var(--red); background: linear-gradient(145deg, rgba(255,68,68,0.05), transparent); }
    .signal-card.wait { border: 2px solid var(--yellow); background: linear-gradient(145deg, rgba(255,204,0,0.05), transparent); }

    .price-tag { font-size: 28px; font-weight: bold; color: var(--gold); margin-bottom: 10px; }
    .signal-arrow { font-size: 80px; margin: 10px 0; filter: drop-shadow(0 0 10px rgba(255,255,255,0.2)); }
    .signal-text { font-size: 32px; font-weight: 900; letter-spacing: 2px; margin-bottom: 15px; }
    .buy .signal-text { color: var(--green); }
    .sell .signal-text { color: var(--red); }
    .wait .signal-text { color: var(--yellow); }

    /* Confidence Circle */
    .conf-circle {
        width: 130px; height: 130px; border-radius: 50%;
        border: 6px solid #333; margin: 15px auto;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.2);
    }
    .conf-circle.high { border-color: var(--green); box-shadow: 0 0 20px rgba(0,255,136,0.3); }
    .conf-circle.med { border-color: var(--yellow); box-shadow: 0 0 20px rgba(255,204,0,0.3); }
    .conf-val { font-size: 36px; font-weight: bold; }
    .conf-label { font-size: 12px; color: var(--text-muted); margin-top: 5px; }

    /* Timer */
    .timer-box {
        margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.05); 
        border-radius: 12px; display: none;
    }
    .timer-box.active { display: block; animation: pulseBorder 2s infinite; }
    @keyframes pulseBorder { 0%,100% { border: 1px solid transparent; } 50% { border: 1px solid var(--gold); } }
    .timer-val { font-size: 42px; font-weight: bold; font-family: monospace; color: var(--gold); }
    .timer-label { font-size: 14px; color: var(--text-muted); margin-bottom: 5px; }

    /* Reasons */
    .reasons-box { text-align: right; margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; border-right: 4px solid var(--gold); }
    .reasons-title { font-weight: bold; color: var(--gold); margin-bottom: 10px; font-size: 15px; }
    .reason-item { display: flex; align-items: center; margin-bottom: 8px; font-size: 13px; }
    .reason-icon { margin-left: 10px; font-size: 16px; }
    .reason-up { color: var(--green); }
    .reason-down { color: var(--red); }
    .reason-neutral { color: var(--text-muted); }

    /* Indicators Grid */
    .indicators-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .ind-item { 
        background: rgba(255,255,255,0.03); padding: 12px; border-radius: 10px; 
        display: flex; justify-content: space-between; align-items: center; 
        border: 1px solid #2a2a35;
    }
    .ind-name { font-size: 12px; color: var(--text-muted); }
    .ind-val { font-weight: bold; font-size: 14px; }
    .ind-up { color: var(--green); }
    .ind-down { color: var(--red); }

    /* Buttons */
    .action-btn {
        width: 100%; padding: 16px; border: none; border-radius: 12px;
        background: linear-gradient(135deg, var(--gold), var(--gold-light));
        color: #000; font-weight: 900; font-size: 20px; cursor: pointer;
        margin-top: 15px; transition: transform 0.2s;
    }
    .action-btn:hover { transform: scale(1.02); }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .disclaimer { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 15px; opacity: 0.7; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1> Gold Sniper M5</h1>
        <button class="theme-btn" onclick="toggleTheme()"> ڕوون/تاریک</button>
    </div>

    <div class="card">
        <div id="chart_div" class="chart-box"></div>
    </div>

    <div class="card signal-card wait" id="signalCard">
        <div class="price-tag">نرخی ئێستا: <span id="priceDisplay">--</span></div>
        
        <div id="signalArrow" class="signal-arrow">⏳</div>
        <div id="signalText" class="signal-text">چاوەڕێبە...</div>
        
        <div class="conf-circle med" id="confCircle">
            <div class="conf-val" id="confVal">0%</div>
            <div class="conf-label">ئاستی دڵنیایی</div>
        </div>

        <div class="timer-box" id="timerBox">
            <div class="timer-label">⏳ کاتی ماوە بۆ کۆتایی شمع (٥ خولەک)</div>
            <div class="timer-val" id="timerVal">05:00</div>
        </div>

        <div class="reasons-box" id="reasonsBox" style="display: none;">
            <div class="reasons-title"> هۆکارەکانی بڕیار:</div>
            <div id="reasonsList"></div>
        </div>
    </div>

    <div class="card">
        <div style="font-weight: bold; margin-bottom: 15px; color: var(--gold);">📊 فلتەرە تەکنیکییەکان (M5)</div>
        <div class="indicators-grid">
            <div class="ind-item"><span class="ind-name">RSI (14)</span><span class="ind-val" id="indRSI">-</span></div>
            <div class="ind-item"><span class="ind-name">MACD</span><span class="ind-val" id="indMACD">-</span></div>
            <div class="ind-item"><span class="ind-name">Stochastic</span><span class="ind-val" id="indStoch">-</span></div>
            <div class="ind-item"><span class="ind-name">Bollinger</span><span class="ind-val" id="indBB">-</span></div>
            <div class="ind-item"><span class="ind-name">Momentum</span><span class="ind-val" id="indMom">-</span></div>
        </div>
    </div>

    <div class="card">
        <button class="action-btn" id="analyzeBtn" onclick="runAnalysis()">🚀 شیکاری و دەستپێکردن</button>
        <div class="disclaimer">⚠️ ئەم بەرنامەیە تەنها بۆ مەبەستی فێربوون و تاقیکردنەوەیە. بازاڕی زێڕ مەترسەی هەیە.</div>
    </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
    // API Key (ئەگەر دەتەوێت بیگۆڕیت، لێرە بیگۆڕە)
    const API_KEY = 'dc1b7bb8236f4158bfe16ae9161dd14e'; 
    let isAnalyzing = false;
    let signalTimer = null;

    // TradingView Chart
    new TradingView.widget({
        "autosize": true, "symbol": "OANDA:XAUUSD", "interval": "5",
        "timezone": "Etc/UTC", "theme": "dark", "style": "1", "locale": "ar",
        "toolbar_bg": "#12121a", "enable_publishing": false, "hide_top_toolbar": false,
        "save_image": false, "container_id": "chart_div",
        "studies": ["RSI@tv-basicstudies", "MACD@tv-basicstudies", "BB@tv-basicstudies"]
    });

    function toggleTheme() { document.body.classList.toggle('light'); }

    // --- Technical Indicators Math ---
    function calcRSI(prices, p=14) {
        if(prices.length < p+1) return 50;
        let g=0, l=0;
        for(let i=prices.length-p; i<prices.length; i++) {
            let c = prices[i]-prices[i-1];
            if(c>0) g+=c; else l+=Math.abs(c);
        }
        let ag=g/p, al=l/p;
        if(al===0) return 100;
        return 100 - (100/(1+ag/al));
    }

    function calcEMA(prices, p) {
        if(prices.length < p) return prices[prices.length-1];
        let k = 2/(p+1);
        let ema = prices.slice(0,p).reduce((a,b)=>a+b,0)/p;
        for(let i=p; i<prices.length; i++) ema = prices[i]*k + ema*(1-k);
        return ema;
    }

    function calcMACD(prices) {
        let e12 = calcEMA(prices, 12), e26 = calcEMA(prices, 26);
        let line = e12 - e26;
        // Simplified signal for M5
        let signal = calcEMA(prices.slice(-26), 9); 
        let hist = line - signal;
        return { hist, dir: hist > 0 ? 'up' : hist < 0 ? 'down' : 'flat' };
    }

    function calcStoch(prices, p=14) {
        let slice = prices.slice(-p);
        let h = Math.max(...slice), l = Math.min(...slice);
        let c = prices[prices.length-1];
        let k = ((c-l)/(h-l))*100;
        return { k, dir: k<20?'up':k>80?'down':'flat' };
    }

    function calcBB(prices, p=20) {
        let sma = prices.slice(-p).reduce((a,b)=>a+b,0)/p;
        let std = Math.sqrt(prices.slice(-p).reduce((s,x)=>s+Math.pow(x-sma,2),0)/p);
        let c = prices[prices.length-1];
        let upper = sma + 2*std, lower = sma - 2*std;
        return { pos: c<=lower?'lower':c>=upper?'upper':'mid', dir: c<=lower?'up':c>=upper?'down':'flat' };
    }

    function calcMom(prices, p=10) {
        let m = prices[prices.length-1] - prices[prices.length-1-p];
        return { m, dir: m>0?'up':m<0?'down':'flat' };
    }

    // --- Main Logic ---
    async function runAnalysis() {
        if(isAnalyzing) return;
        isAnalyzing = true;
        const btn = document.getElementById('analyzeBtn');
        btn.disabled = true; btn.textContent = " وەرگرتنی داتا لە Twelve Data...";

        try {
            const res = await fetch(`https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=5min&outputsize=100&apikey=${API_KEY}`);
            const data = await res.json();
            
            if(data.status !== 'ok' || !data.values) throw new Error('API Error');
            
            let prices = data.values.map(v => parseFloat(v.close)).reverse();
            let currentPrice = prices[prices.length-1];
            document.getElementById('priceDisplay').textContent = currentPrice.toFixed(2);

            // Calculate
            let rsi = calcRSI(prices);
            let macd = calcMACD(prices);
            let stoch = calcStoch(prices);
            let bb = calcBB(prices);
            let mom = calcMom(prices);

            // Update UI Indicators
            updateInd('indRSI', rsi.toFixed(1), rsi<30?'ind-up':rsi>70?'ind-down':'');
            updateInd('indMACD', macd.hist.toFixed(2), macd.dir==='up'?'ind-up':macd.dir==='down'?'ind-down':'');
            updateInd('indStoch', stoch.k.toFixed(1), stoch.dir==='up'?'ind-up':stoch.dir==='down'?'ind-down':'');
            updateInd('indBB', bb.pos, bb.dir==='up'?'ind-up':bb.dir==='down'?'ind-down':'');
            updateInd('indMom', mom.m.toFixed(2), mom.dir==='up'?'ind-up':mom.dir==='down'?'ind-down':'');

            // Scoring (Max 10)
            let score = 0;
            let reasons = [];

            // RSI (Weight 3)
            if(rsi < 30) { score += 3; reasons.push({t:`RSI نزمە (${rsi.toFixed(1)}) - بازاڕ زۆر فرۆشراوە`, d:'up'}); }
            else if(rsi > 70) { score -= 3; reasons.push({t:`RSI بەرزە (${rsi.toFixed(1)}) - بازاڕ زۆر کڕاوە`, d:'down'}); }
            else { reasons.push({t:`RSI ناوەندییە (${rsi.toFixed(1)})`, d:'neutral'}); }

            // MACD (Weight 3)
            if(macd.dir === 'up') { score += 3; reasons.push({t:"MACD ئەرێنییە (Bullish)", d:'up'}); }
            else if(macd.dir === 'down') { score -= 3; reasons.push({t:"MACD نەرێنییە (Bearish)", d:'down'}); }
            else { reasons.push({t:"MACD لاوازە", d:'neutral'}); }

            // Stoch (Weight 2)
            if(stoch.dir === 'up') { score += 2; reasons.push({t:"Stochastic نزمە (Oversold)", d:'up'}); }
            else if(stoch.dir === 'down') { score -= 2; reasons.push({t:"Stochastic بەرزە (Overbought)", d:'down'}); }

            // BB (Weight 1)
            if(bb.dir === 'up') { score += 1; reasons.push({t:"نرخ گەیشتە باندی خوارەوەی Bollinger", d:'up'}); }
            else if(bb.dir === 'down') { score -= 1; reasons.push({t:"نرخ گەیشتە باندی سەرەوەی Bollinger", d:'down'}); }

            // Momentum (Weight 1)
            if(mom.dir === 'up') { score += 1; reasons.push({t:"Momentum ئەرێنییە", d:'up'}); }
            else if(mom.dir === 'down') { score -= 1; reasons.push({t:"Momentum نەرێنییە", d:'down'}); }

            // Confidence
            let conf = Math.min(99, Math.abs(score) * 10);
            document.getElementById('confVal').textContent = conf.toFixed(0) + '%';

            // Decision
            const card = document.getElementById('signalCard');
            const arrow = document.getElementById('signalArrow');
            const text = document.getElementById('signalText');
            const circle = document.getElementById('confCircle');
            const reasonsBox = document.getElementById('reasonsBox');
            const reasonsList = document.getElementById('reasonsList');

            reasonsBox.style.display = 'block';
            reasonsList.innerHTML = reasons.map(r => `
                <div class="reason-item">
                    <span class="reason-icon ${r.d==='up'?'reason-up':r.d==='down'?'reason-down':'reason-neutral'}">
                        ${r.d==='up'?'✅':r.d==='down'?'🔴':'⚪'}
                    </span>
                    <span class="${r.d==='up'?'reason-up':r.d==='down'?'reason-down':'reason-neutral'}">${r.t}</span>
                </div>
            `).join('');

            // Threshold: 70% confidence (Score >= 7 or <= -7)
            if(conf >= 70) {
                if(score > 0) {
                    // BUY
                    card.className = 'card signal-card buy';
                    arrow.textContent = '⬆️';
                    text.textContent = 'BUY (کڕین)';
                    circle.className = 'conf-circle high';
                    start5MinTimer();
                } else {
                    // SELL
                    card.className = 'card signal-card sell';
                    arrow.textContent = '⬇️';
                    text.textContent = 'SELL (فرۆشتن)';
                    circle.className = 'conf-circle high';
                    start5MinTimer();
                }
            } else {
                // WAIT
                card.className = 'card signal-card wait';
                arrow.textContent = '✋';
                text.textContent = 'WAIT (چاوەڕێ)';
                circle.className = 'conf-circle med';
                document.getElementById('timerBox').classList.remove('active');
            }

        } catch(e) {
            alert('هەڵە لە وەرگرتنی داتا: ' + e.message);
        }

        isAnalyzing = false;
        btn.disabled = false;
        btn.textContent = "🔄 شیکاری نوێ";
    }

    function updateInd(id, val, cls) {
        let el = document.getElementById(id);
        el.textContent = val;
        el.className = 'ind-val ' + cls;
    }

    function start5MinTimer() {
        let time = 300; // 5 minutes in seconds
        const timerBox = document.getElementById('timerBox');
        const timerVal = document.getElementById('timerVal');
        const btn = document.getElementById('analyzeBtn');
        
        timerBox.classList.add('active');
        btn.disabled = true;
        btn.textContent = "⏳ سیگناڵ چالاکە - چاوەڕوانی بۆ شمعی داهاتوو...";

        if(signalTimer) clearInterval(signalTimer);
        
        signalTimer = setInterval(() => {
            let m = Math.floor(time / 60);
            let s = time % 60;
            timerVal.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            
            if(time <= 0) {
                clearInterval(signalTimer);
                timerBox.classList.remove('active');
                btn.disabled = false;
                btn.textContent = "🚀 شیکاری و دەستپێکردن";
                // Reset to wait
                document.getElementById('signalCard').className = 'card signal-card wait';
                document.getElementById('signalArrow').textContent = '⏳';
                document.getElementById('signalText').textContent = 'چاوەڕێبە...';
            }
            time--;
        }, 1000);
    }
</script>
</body>
</html>
